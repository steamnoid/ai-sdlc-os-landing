name: Publish the page

# The page is a view of another repository, so it is rebuilt on a schedule and not only
# when it is edited. The schedule is what keeps a hand-written page honest; it is also
# what GitHub quietly turns off, which is why the keepalive job below exists.
on:
  push:
    branches: [main]
  schedule:
    # Seventeen past, not on the hour: a schedule at :00 is queued behind everybody
    # else's, and GitHub documents that under load some of those jobs are dropped.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Pages keeps only the newest deployment, so a second run cancels the first rather
  # than the two deploying out of order.
  group: pages
  cancel-in-progress: true

env:
  # The branch the project is on. `main` there holds two commits and no source at all,
  # so the page would have nothing to show. One value changes when the work merges.
  THE_BRANCH: phase-1-foundation

jobs:
  collect:
    name: Read the repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: curl -fsSL https://astral.sh/uv/install.sh | sh

      - name: Check out the project this page is about
        # Checked out here rather than by the collector, because the next step needs the
        # project on disk and the step after that needs its dependencies installed: a
        # collector that cloned as its first act would have nothing to sync against.
        run: |
          mkdir -p build
          git clone --quiet --branch "$THE_BRANCH" https://github.com/steamnoid/ai-sdlc-os.git build/the-repository

      - name: Install the project's own dependencies
        # The collector imports the project's code, and that code imports langgraph. A
        # bare interpreter cannot read the state machine, and the refusal it produces
        # says so by name — which is the right behaviour and not a way to build a page.
        run: ~/.local/bin/uv sync --all-extras --project build/the-repository

      - name: Read the repository, run its suite, and write the state
        # No GITHUB_TOKEN is passed on purpose: GitHub documents that using it against
        # the REST API invites secondary rate limits, and these are public endpoints.
        # If a call fails the collectors record "unread" with the reason, so a rate
        # limit shortens the page instead of breaking the build.
        #
        # The interpreter is left to the collector, which prefers the checkout's own
        # virtual environment — the one just installed.
        run: |
          node scripts/ask_the_repository.mjs \
            --repository build/the-repository \
            --ref "$THE_BRANCH" \
            --run-the-suite \
            --github-api https://api.github.com \
            --out src/state/the_repository.json

      - name: The collectors' own tests
        # These three files need nothing but node, so they run before the project's
        # dependencies exist and without `npm ci` at all. The fourth test builds the
        # page and needs Astro, so it runs in the build job where the state it reads is
        # already there.
        run: npm run test:collectors

      - uses: actions/upload-artifact@v4
        with:
          name: the-state
          path: src/state/the_repository.json
          retention-days: 7

  build:
    name: Build the page
    needs: collect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Take the state the collect job read
        uses: actions/download-artifact@v4
        with:
          name: the-state

      - run: npm ci

      - name: The page's own test
        # The test that builds the page and checks its facts against the state just
        # read. It is the one that catches a sentence somebody typed, and it needs the
        # state and Astro, so it belongs here rather than in the collect job.
        run: npm run test:page

      - run: npm run build

      - uses: actions/configure-pages@v5
        with:
          # Turns Pages on if it is off. The first attempt at this failed without it,
          # and the failure is an error that says nothing about Pages.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  keepalive:
    name: Keep the schedule alive
    needs: deploy
    runs-on: ubuntu-latest
    # GitHub disables scheduled workflows in a public repository after 60 days without
    # activity in it — and a page that rebuilds itself never gets a commit, which is
    # exactly the case that would switch it off. An empty commit well inside the
    # window keeps the page's own mechanism from being the thing that ends it.
    #
    # Once every 45 days rather than every 6 hours, so the history carries one empty
    # commit a month and not two hundred a year.
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: How long since this repository last heard from a human
        id: silence
        run: |
          last="$(git log -1 --format=%cI)"
          days=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 86400 ))
          echo "days_since_the_last_commit=$days" >> "$GITHUB_OUTPUT"

      - name: An empty commit, only if the silence is close to the limit
        if: steps.silence.outputs.days_since_the_last_commit >= 45
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore(page): the schedule kept itself alive"
          git push
