[project]
name = "a-small-repository"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "psycopg[binary]>=3.0",
    "httpx>=0.28",
]

[project.optional-dependencies]
# The graph and the model factory, kept out of the default install.
agent = [
    "langgraph>=1.0",
]

[dependency-groups]
dev = ["pytest>=9.0"]
